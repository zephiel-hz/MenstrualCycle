<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mode Offline — Ricil's</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #FAF8F5;
      color: #221B1F;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #FFFFFF;
      border: 1px solid #EFE9E2;
      padding: 40px 28px;
      border-radius: 28px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(34, 27, 31, 0.04);
    }
    .logo-container {
      width: 56px;
      height: 56px;
      border-radius: 18px;
      background: linear-gradient(135deg, #D8647F 0%, #B84762 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      box-shadow: 0 4px 12px rgba(216, 100, 127, 0.25);
    }
    .logo-container svg {
      width: 28px;
      height: 28px;
      fill: none;
      stroke: #FAF8F5;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .tag {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #D8647F;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #221B1F;
      margin-bottom: 12px;
    }
    p {
      font-size: 13px;
      color: #7D7277;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn-primary {
      background: #D8647F;
      color: #FFFFFF;
      border: none;
      padding: 12px 24px;
      border-radius: 9999px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 2px 8px rgba(216, 100, 127, 0.25);
    }
    .btn-primary:active {
      transform: scale(0.97);
    }
    .btn-secondary {
      background: #FAF6F3;
      color: #221B1F;
      border: 1px solid #EFE9E2;
      padding: 12px 24px;
      border-radius: 9999px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: all 0.2s ease;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-container">
      <svg viewBox="0 0 24 24">
        <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
      </svg>
    </div>
    <span class="tag">Offline Mode</span>
    <h1>Koneksi Terputus</h1>
    <p>Aplikasi tetap dapat digunakan secara offline. Catatan siklus baru yang kamu buat akan tersimpan di perangkat dan disinkronkan secara otomatis ke database saat internet kembali aktif.</p>
    <div class="actions">
      <button class="btn-primary" onclick="window.location.reload()">Coba Muat Ulang</button>
      <a href="/dashboard" class="btn-secondary">Buka Dashboard Offline</a>
    </div>
  </div>
</body>
</html>
