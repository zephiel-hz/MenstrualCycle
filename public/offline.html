<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mode Offline - Ricil&apos;s</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #FAF8F5;
      color: #2D2727;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: #FFFFFF;
      border: 1px solid #E8E0D5;
      padding: 32px 24px;
      border-radius: 24px;
      max-width: 400px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.04);
    }
    h1 {
      font-size: 20px;
      margin-bottom: 8px;
      color: #E78895;
    }
    p {
      font-size: 14px;
      color: #79716B;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    button {
      background: #E78895;
      color: #FFF;
      border: none;
      padding: 12px 24px;
      border-radius: 9999px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Sedang Offline</h1>
    <p>Koneksi internet tidak tersedia. Data kesehatanmu tersimpan aman di server dan akan disinkronkan kembali saat koneksi terhubung.</p>
    <button onclick="window.location.reload()">Coba Muat Ulang</button>
  </div>
</body>
</html>
